name: parejas_app
description: App de juegos de cartas para parejas — clásicos y de conexión.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  cupertino_icons: ^1.0.6

  # Cuentas, pairing y progresión (ver ACCOUNTS_AND_PROGRESSION.md)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # Para el descubrimiento por WiFi (sección 3.1 del diseño) — no
  # integrado todavía, dejar comentado hasta implementar
  # PairingRepository.discoverOnLocalNetwork.
  # network_info_plus: ^6.1.0
  # multicast_dns: ^0.3.2+6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
