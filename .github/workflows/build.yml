name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Reparar estructura y generar carpeta Android nativa
        run: |
          if [ ! -f "pubspec.yaml" ] && [ -f "parejas_app/pubspec.yaml" ]; then
            mv parejas_app/* . 2>/dev/null || true
          fi
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.parejasapp
          fi

      - name: Obtener dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Imprimir Huellas Digitales
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk || true

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
